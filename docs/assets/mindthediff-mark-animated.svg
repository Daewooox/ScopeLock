<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Animated MindTheDiff mark</title>
  <desc id="desc">A reviewed git fork with a signal moving along the accepted path.</desc>
  <rect width="64" height="64" rx="13" fill="#070D1A"/>
  <path d="M8 24H22" fill="none" stroke="#90A8A6" stroke-width="4" stroke-linecap="round"/>
  <path d="M22 24H54" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
  <path d="M22 24 41.5 43.5M38.5 46.5 44.5 40.5" fill="none" stroke="#5C7876" stroke-width="4" stroke-linecap="round"/>
  <circle cx="22" cy="24" r="5" fill="#070D1A" stroke="#F59E0B" stroke-width="3">
    <animate attributeName="r" values="5;6;5" dur="3.3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".72;1;.72" dur="3.3s" repeatCount="indefinite"/>
  </circle>
  <circle class="signal" r="2.4" fill="#86EFAC">
    <animateMotion path="M22 24H54" dur="3.3s" keyTimes="0;.12;.6;1" keyPoints="0;0;1;1" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.6;1" dur="3.3s" repeatCount="indefinite"/>
  </circle>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .signal { display: none; }
      animate, animateMotion { display: none; }
    }
  </style>
</svg>
